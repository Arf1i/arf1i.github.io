<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>byak</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12140f" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="byak">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="stylesheet" href="./styles.css?v=1795445000">
<script>
  // Тема применяется до первой отрисовки — без вспышки белого
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('byak.theme'); } catch (e) {}
    var theme = saved || 'auto';
    document.documentElement.dataset.theme = theme;
  })();
</script>
</head>
<body>

<div class="gate" id="gate" hidden>
  <form class="gate__card" id="gate-form" autocomplete="off">
    <input class="gate__input" id="gate-input" type="password" inputmode="text"
           autocomplete="current-password" autocapitalize="off" spellcheck="false"
           enterkeyhint="go" aria-label="Код доступа" required>
    <button class="gate__submit" type="submit" aria-label="Войти">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13.5M12.5 5l7 7-7 7"/></svg>
    </button>
    <p class="gate__error" id="gate-error" role="alert" hidden>Нет.</p>
  </form>
</div>

<div class="shell" id="shell" hidden>

  <header class="topbar">
    <div class="topbar__text">
      <p class="eyebrow" id="eyebrow">Сегодня</p>
      <h1 class="display" id="heading">Дела</h1>
    </div>
    <div class="topbar__actions">
      <button class="icon-btn" id="theme-btn" type="button" aria-label="Сменить тему" title="Сменить тему">
        <svg class="icon icon--sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
        <svg class="icon icon--moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/></svg>
        <svg class="icon icon--auto" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 000 17z" fill="currentColor" stroke="none"/></svg>
      </button>
    </div>
  </header>

  <p class="offline-note" id="offline-note" hidden>Нет сети. Отметки сохранятся и уйдут, когда связь вернётся.</p>
  <p class="offline-note offline-note--error" id="error-note" hidden>
    <span id="error-text">Не удалось загрузить данные.</span>
    <button class="link-btn" id="retry-btn" type="button">Повторить</button>
  </p>
  <p class="demo-note" id="demo-note" hidden>
    Демо-режим: показаны примеры. Заполните <code>config.js</code> ключами Supabase — данные появятся сами.
  </p>

  <main class="views" id="views">

    <!-- view -->
    <section class="view" id="view-tasks" aria-labelledby="heading">
      <div class="summary" id="summary"></div>
      <div class="segmented" role="tablist" aria-label="Фильтр дел">
        <button class="segmented__btn is-active" data-filter="active" role="tab" aria-selected="true">Активные</button>
        <button class="segmented__btn" data-filter="all" role="tab" aria-selected="false">Все</button>
        <button class="segmented__btn" data-filter="done" role="tab" aria-selected="false">Сделано</button>
      </div>
      <div id="tasks-list" class="stack"></div>
    </section>

    <!-- view -->
    <section class="view" id="view-diary" hidden aria-labelledby="heading">
      <div id="diary-list" class="stack"></div>
    </section>

    <!-- view -->
    <section class="view" id="view-reports" hidden aria-labelledby="heading">
      <div id="reports-list" class="stack"></div>
    </section>

  </main>

  <nav class="tabbar" aria-label="Разделы">
    <button class="tabbar__btn is-active" data-view="tasks" type="button">
      <svg class="tabbar__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 6.5l2 2 3.5-4M4.5 13.5l2 2 3.5-4M13.5 7h6M13.5 14h6M13.5 20h6M4.5 19.5h5"/></svg>
      <span>Дела</span>
    </button>
    <button class="tabbar__btn" data-view="diary" type="button">
      <svg class="tabbar__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h9.5A2.5 2.5 0 0117 7v13H7.5A2.5 2.5 0 015 17.5v-13z"/><path d="M17 8.5h2v11.5h-2M8.5 9h5M8.5 12.5h5"/></svg>
      <span>Дневник</span>
    </button>
    <button class="tabbar__btn" data-view="reports" type="button">
      <svg class="tabbar__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 20V10M12 20V4.5M18 20v-6.5"/></svg>
      <span>Отчёты</span>
    </button>
  </nav>

</div>

<div class="modal" id="modal" hidden>
  <div class="modal__scrim" data-close="1"></div>
  <div class="modal__sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal__grab" aria-hidden="true"></div>
    <div class="modal__head">
      <div class="modal__headText">
        <p class="eyebrow" id="modal-meta"></p>
        <h2 class="modal__title" id="modal-title"></h2>
      </div>
      <button class="icon-btn icon-btn--ghost" id="modal-close" type="button" aria-label="Закрыть">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="modal__body prose" id="modal-body"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="./vendor/supabase.js" defer></script>
<script src="./config.js?v=1795445000" defer></script>
<script src="./app.js?v=1795445000" defer></script>
</body>
</html>
